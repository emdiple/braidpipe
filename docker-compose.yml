# braidpipe + an external Python worker, talking over a shared socket volume.
#
#   docker compose up --build
#   ffplay 'srt://127.0.0.1:8891?latency=200'      # watch the output
#
# The shared-memory segment is anonymous: its fd crosses the container
# boundary inside the daemon's UDS reply, so only the socket directory needs
# to be shared -- no /dev/shm mount, no ipc: host.
#
# The daemon never respawns a dead worker by design; `restart: unless-stopped`
# on the worker service is what closes that loop here. The stream itself never
# depends on the worker: while the worker is down the daemon emits passthrough.
#
# Metrics are served on 127.0.0.1 inside the daemon's netns; opt in to the
# socat bridge with:  docker compose --profile metrics up
#   curl http://127.0.0.1:9185/metrics

services:
  braidpipe:
    build: .
    image: braidpipe
    command:
      - --external-worker
      - --rust-sock=/sockets/rust.sock
      - --python-sock=/sockets/python.sock
      - --preset=lowlatency
      # Match the source format. Anything else makes videoscale resample the
      # feed before it is encoded -- the daemon's own defaults are 720p30, which
      # quietly costs a 1080p50 input most of its quality.
      - --width=1920
      - --height=1080
      - --fps=50
      # SRT in and out. The input dials an SRT source on the host (e.g. a
      # MediaMTX/OBS listener on 8890) -- host.docker.internal is 127.0.0.1
      # seen from inside the container. The output listens on 8891; watch it
      # with `ffplay 'srt://127.0.0.1:8891?latency=200'`. Note the pipeline
      # waits for the first viewer before frames start moving.
      - --uri=srt://host.docker.internal:8890?mode=caller&latency=200
      - --output=srt://0.0.0.0:8891?mode=listener&latency=200
      # Embedded audio is carried through (decoded, re-encoded to AAC, muxed).
      - --audio
      # Real-world alternatives:
      # - --output=rtmp://my-server/live/stream
      # - --output=udp://host.docker.internal:9720   (never blocks on a viewer;
      #   watch with `ffplay udp://127.0.0.1:9720`)
      # - --uri=srt://0.0.0.0:9000?mode=listener   (accept a publisher instead
      #   of dialing one; publish 9000/udp)
      # Drop --uri (and --audio) to fall back to the built-in test pattern.
    environment:
      # lowlatency's 4500 kbps default assumes 720p30. When bandwidth is free,
      # bitrate is the quality knob: 16 Mbps makes 1080p50 essentially
      # transparent even on x264's veryfast, and it costs no latency -- unlike
      # a slower speed preset, which buys little at this bitrate and can push a
      # software 1080p50 encode past real time. Every preset parameter can be
      # overridden the same way; see crates/braidpipe/src/preset.rs.
      BRAIDPIPE_BITRATE_KBPS: "16000"
    extra_hosts:
      - host.docker.internal:host-gateway   # so the Linux engine resolves it too
    volumes:
      - sockets:/sockets
    ports:
      - "8891:8891/udp"   # SRT output listener (SRT rides on UDP)
      - "9185:9185"       # metrics, only live with --profile metrics
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: braidpipe-worker
    # command: ["worker_stamp.py"]   # or any other bundled/own worker
    environment:
      BRAIDPIPE_RUST_SOCK: /sockets/rust.sock
      BRAIDPIPE_PYTHON_SOCK: /sockets/python.sock
    volumes:
      - sockets:/sockets
    restart: unless-stopped

  # The daemon binds its Prometheus endpoint to 127.0.0.1 only, which inside a
  # container is unreachable from anywhere else. This sidecar joins the
  # daemon's network namespace and forwards 0.0.0.0:9185 -> 127.0.0.1:9184.
  metrics:
    profiles: [metrics]
    image: alpine/socat
    network_mode: service:braidpipe
    command: TCP-LISTEN:9185,fork,reuseaddr TCP:127.0.0.1:9184
    depends_on:
      - braidpipe
    restart: unless-stopped

volumes:
  sockets:
