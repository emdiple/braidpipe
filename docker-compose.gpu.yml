# GPU overlay: hands the container a GPU so decode and encode run on hardware.
# Kept separate so the default stack keeps working on GPU-less machines, where
# the reservation below would fail with "could not select device driver".
#
# It does not change the image. NVENC/NVDEC need libnvidia-encode/libnvcuvid,
# which no image can ship -- only the host's nvidia-container-toolkit can
# inject them, and it does so on any base. The daemon image already carries
# libgstnvcodec.so (in gstreamer1.0-plugins-bad), which dlopens them at run
# time. So the plain `braidpipe` image is the GPU image too.
#
# Usage, on a Linux host with the nvidia-container-toolkit installed:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Verify in the logs: "Video encoder in use (hardware) element=nvh264enc"
# (or vah264enc) and "Hardware decoders promoted for autoplugging".
# BRAIDPIPE_HW=off in the environment turns both directions back off.
#
# If NVENC is missing, the toolkit is the thing to check -- no image substitutes
# for it. This prints the injected libraries when it is working:
#
#   docker run --rm --gpus all -e NVIDIA_DRIVER_CAPABILITIES=compute,video,utility \
#     debian:trixie-slim ls /usr/lib/x86_64-linux-gnu | grep libnvidia-encode
#
# Empty output means the toolkit is not installed or not registered as a runtime:
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
#
# Hosts that set nvidia as docker's *default* runtime need no overlay at all:
# the image's own NVIDIA_VISIBLE_DEVICES=all is enough to be granted the GPU.

services:
  braidpipe:
    environment:
      # `video` is what exposes NVENC/NVDEC; without it only compute crosses.
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Intel/AMD instead of NVIDIA: comment out the deploy block above and hand
    # the render node in -- the image's va-driver-all covers both vendors.
    # devices:
    #   - /dev/dri:/dev/dri
