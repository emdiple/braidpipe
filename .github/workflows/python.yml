# SDK tests: pure Python against the fake daemon in python/tests — no Rust or
# GStreamer in the loop, which is what keeps this matrix cheap.
name: python

on:
  push:
    branches: [main, dev]
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]

jobs:
  test:
    name: sdk py${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Installing (not just adding to sys.path) makes packaging failures fail CI too.
      - run: pip install ./python
      - run: python -m unittest discover -v python/tests
