[workspace]
resolver = "2"
members = [
    "crates/braidpipe",
    "crates/braidpipe-core",
    "crates/braidpipe-engine",
    "crates/braidpipe-ipc",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Mohammadtaghi Yousefi <emdiple.95@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Member crates must be declared here for sub-crates to inherit them!
braidpipe-core = { path = "crates/braidpipe-core" }
braidpipe-engine = { path = "crates/braidpipe-engine" }
braidpipe-ipc = { path = "crates/braidpipe-ipc" }

# Third-party dependencies
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
thiserror = "2.0.19"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["full"] }